name: Publish Docker Images

on: push

jobs:
  publish-images:
    name: Publish Docker Images
    runs-on: ubuntu-latest
    if: github.repository_owner == 'noagenda'
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
      -
        name: Extract Branch Name
        shell: bash
        run: |
          APP_TAG=${GITHUB_REF#refs/heads/}
          # Docker tags cannot contain slashes. Keep branch names readable while
          # making feature/update branches safe for GHCR tags.
          APP_TAG=${APP_TAG//\//-}
          if [[ "$APP_TAG" == 'production' ]]; then
            echo 'APP_TAG=latest' >> "$GITHUB_OUTPUT"
          else
            echo "APP_TAG=$APP_TAG" >> "$GITHUB_OUTPUT"
          fi
        id: extract-branch
      -
        name: Build Images
        run: |
          export APP_TAG=${{ steps.extract-branch.outputs.APP_TAG }}
          docker compose -f compose.yaml -f compose.services.yaml build --build-arg GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}
      -
        name: Login to GitHub Packages
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      -
        name: Push Images
        run: |
          export APP_TAG=${{ steps.extract-branch.outputs.APP_TAG }}
          docker compose -f compose.yaml -f compose.services.yaml push
